[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmauth"
version = "0.1.0"
description = "Delegated identity for AI agents: Ed25519 identities, narrowing mandates, human approvals, signed audit logs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["swarmauth"]
